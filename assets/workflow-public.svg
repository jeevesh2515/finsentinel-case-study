<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" role="img" aria-labelledby="title desc">
  <title id="title">FinSentinel public review workflow (simplified)</title>
  <desc id="desc">Simplified public diagram of the human review lifecycle: triage routes cases to pending review, a named reviewer claims and transitions them to cleared, escalated, or drafted for review. Weak evidence abstains. Terminal states have no outgoing transitions; every transition feeds the audit trail.</desc>
  <style>
    .state { fill: #101418; stroke: #3a4750; stroke-width: 1.5; }
    .entry { fill: #1b232b; stroke: #d97706; stroke-width: 1.5; }
    .terminal { fill: #1d2a1f; stroke: #4ade80; stroke-width: 1.5; }
    .abstain { fill: #241c22; stroke: #c084fc; stroke-width: 1.5; }
    .label { fill: #e8edf2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; }
    .sub { fill: #9fb0bd; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
    .edge { stroke: #55656f; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .bus { stroke: #55656f; stroke-width: 2; fill: none; }
    .edgelabel { fill: #8b9aa5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#55656f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="480" fill="#0b0e11"/>
  <text x="40" y="46" class="label" font-size="20">Human review workflow (simplified)</text>
  <text x="40" y="70" class="sub">Every transition is a named human action recorded in the audit trail. No autonomous final action exists.</text>

  <rect x="40" y="110" width="190" height="66" rx="10" class="entry"/>
  <text x="56" y="140" class="label" font-size="14">Triage outcome</text>
  <text x="56" y="160" class="sub">Priority determines routing</text>

  <rect x="40" y="240" width="190" height="66" rx="10" class="abstain"/>
  <text x="56" y="270" class="label" font-size="14">Insufficient evidence</text>
  <text x="56" y="290" class="sub">Abstains; no padded draft</text>

  <rect x="310" y="110" width="190" height="66" rx="10" class="state"/>
  <text x="326" y="140" class="label" font-size="14">Pending review</text>
  <text x="326" y="160" class="sub">Awaiting a reviewer</text>

  <rect x="310" y="240" width="190" height="66" rx="10" class="state"/>
  <text x="326" y="270" class="label" font-size="14">In review</text>
  <text x="326" y="290" class="sub">Claimed by one reviewer</text>

  <rect x="610" y="80" width="190" height="62" rx="10" class="terminal"/>
  <text x="626" y="108" class="label" font-size="14">Cleared</text>
  <text x="626" y="128" class="sub">Reviewed, no action</text>

  <rect x="610" y="180" width="190" height="62" rx="10" class="terminal"/>
  <text x="626" y="208" class="label" font-size="14">Escalated</text>
  <text x="626" y="228" class="sub">Routed onward, human-owned</text>

  <rect x="610" y="280" width="190" height="62" rx="10" class="terminal"/>
  <text x="626" y="308" class="label" font-size="14">Drafted for review</text>
  <text x="626" y="328" class="sub">Review-ready material</text>

  <rect x="610" y="390" width="390" height="62" rx="10" class="state"/>
  <text x="626" y="416" class="label" font-size="14">Audit trail</text>
  <text x="626" y="436" class="sub">Reviewer identity, from/to state, timestamp</text>

  <path class="edge" d="M 230 143 L 304 143"/>
  <path class="edge" d="M 135 176 L 135 234"/>
  <text x="106" y="210" class="edgelabel" font-size="11">weak evidence</text>
  <path class="edge" d="M 405 176 L 405 234"/>
  <path class="edge" d="M 500 258 C 545 222 570 170 604 122"/>
  <text x="524" y="186" class="edgelabel">cleared</text>
  <path class="edge" d="M 500 273 L 604 211"/>
  <text x="520" y="238" class="edgelabel">escalated</text>
  <path class="edge" d="M 500 288 C 545 300 570 305 604 306"/>
  <text x="524" y="330" class="edgelabel">drafted</text>
  <path class="edge" d="M 800 100 H 950 V 386"/>
  <path class="bus" d="M 800 211 H 950"/>
  <path class="bus" d="M 800 311 H 950"/>
  <path class="bus" d="M 950 211 V 311"/>
</svg>
